name: Vérifier et publier le jeu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests de non-régression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier JavaScript et la simulation
        run: |
          for file in dist/*.mjs; do node --check "$file"; done
          npm test
      - name: Installer le navigateur de validation
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Vérifier les interactions ordinateur et tactile
        run: npm run test:browser
      - name: Conserver les captures de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-v5
          path: test-results/
          retention-days: 7

  deploy:
    name: Publier GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Déployer le jeu
        id: deployment
        uses: actions/deploy-pages@v5
