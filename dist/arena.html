<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BandLive — Arène de test</title><link rel="stylesheet" href="bandlive-physical.css?v=0.9.0"><link rel="stylesheet" href="arena.css?v=0.9.0"></head><body>
<header><div><small>BANDLIVE / ARÈNE ISOLÉE</small><h1>Les Éclats</h1><p id="song"></p></div><div id="stats"></div></header>
<section class="queue-strip"><span id="queue-info"></span><button id="queue-open">Voir la file</button><span id="pressure"></span></section>
<main id="arena-scroll"><div id="arena-board"><canvas id="arena-canvas" width="1120" height="800" aria-label="Terrain du show : sélectionner une carte, puis viser le public"></canvas><div id="hands"></div><aside id="preview" hidden aria-live="polite"></aside></div></main>
<footer><div><button id="workshop">Atelier</button><button id="restart">Recommencer</button><button id="layout">Disposition</button><button id="cancel" hidden>Reposer la carte · Échap</button><label><input id="reduced" type="checkbox"> Effets réduits</label><label><input id="sound" type="checkbox"> Son</label><a href="./">Retour au jeu</a></div><button id="end">Fin du tour →</button></footer>
<p id="message" role="status"></p>
<dialog id="workshop-dialog"><div class="dialog-head"><h2>Atelier du prototype</h2><button data-close>Retour au show ×</button></div><nav><button data-tab="show">Show</button><button data-tab="public">Public et boss</button><button data-tab="cards">Cartes et decks</button><button data-tab="physics">Physique et disposition</button></nav><p>Les modifications restent dans ce prototype. Appliquer redémarre le scénario; les cartes peuvent aussi être essayées dans le show en cours.</p><div id="workshop-body"></div><p id="config-error" role="alert"></p><div class="dialog-actions"><button id="export">Exporter le prototype</button><label class="button">Importer <input type="file" id="import" accept="application/json" hidden></label><button id="apply">Appliquer et recommencer</button></div></dialog>
<dialog id="queue-dialog"><div class="dialog-head"><h2>File du show</h2><button data-close>Fermer ×</button></div><div id="queue-body"></div></dialog>
<dialog id="result-dialog"><h2 id="result-title"></h2><div id="result-body"></div><button id="result-restart">Rejouer ce scénario</button><button data-close>Inspecter le résultat</button></dialog>
<script type="module" src="arena-app.mjs?v=0.9.0"></script></body></html>
